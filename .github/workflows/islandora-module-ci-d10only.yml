# Deprecated: call islandora-module-ci.yml with drupal_versions: '["10.6"]'
# instead. Kept so existing callers (assign_calc) keep working; it delegates to
# the main workflow, so the two can't drift apart.
name: Islandora Module CI (Drupal 10 only, deprecated)

on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
        description: "The machine name of the module (e.g., citation_select)"
      install_chromedriver:
        required: false
        type: boolean
        default: false
        description: "Start the Chromedriver container. Only FunctionalJavascript tests need it."

permissions:
  contents: read

jobs:
  islandora-module-ci:
    uses: digitalutsc/reusable_workflows/.github/workflows/islandora-module-ci.yml@main
    with:
      module_name: ${{ inputs.module_name }}
      install_chromedriver: ${{ inputs.install_chromedriver }}
      drupal_versions: '["10.6"]'
