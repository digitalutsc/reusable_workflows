# Self-test: runs the reusable workflows against the passing_tests module at the
# repository root, so a change to them is exercised before callers pick it up.
name: Self-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  islandora-module-ci:
    uses: ./.github/workflows/islandora-module-ci.yml
    with:
      module_name: passing_tests
