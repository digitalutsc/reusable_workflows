name: Islandora Module CI

# The Drupal x PHP matrix is computed on every run, so new Drupal releases are
# picked up without editing this file:
#   - majors: every major drupal.org lists in supported_branches
#   - minors: the `minors_per_major` newest minors of each major with a stable
#     release. A major with no stable release yet (the next major) gets its
#     newest branch, non-blocking (`include_next_major`)
#   - PHP: the lowest and the highest version that ghcr.io/islandora/ci is
#     built for and that the minor's core/composer.json allows
#   - image: ghcr.io/islandora/ci:<minor>-php<php>; when Islandora hasn't
#     published that tag yet, the job builds it from Islandora's Dockerfile

on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
        description: "The machine name of the module (e.g., citation_select)"
      install_chromedriver:
        required: false
        type: boolean
        default: false
        description: "Start the Chromedriver container. Only FunctionalJavascript tests need it."
      minors_per_major:
        required: false
        type: number
        default: 2
        description: "How many of the newest released minors of each supported Drupal major to test"
      include_next_major:
        required: false
        type: boolean
        default: true
        description: "Also test the next Drupal major before its first stable release (non-blocking)"
      drupal_versions:
        required: false
        type: string
        default: ''
        description: 'Override: JSON array of Drupal minors (e.g. ''["10.6"]''). Empty = computed from drupal.org'
      php_versions:
        required: false
        type: string
        default: ''
        description: 'Override: JSON array of PHP versions (e.g. ''["8.4"]''). Empty = lowest and highest each minor allows'
      repository:
        required: false
        type: string
        default: ''
        description: "Module repository to test (owner/name). Empty = the calling repository"
      ref:
        required: false
        type: string
        default: ''
        description: "Branch, tag or SHA of `repository`. Empty = the triggering ref (or the default branch)"
      timeout_minutes:
        required: false
        type: number
        default: 30
        description: "Per-job timeout, so a hung test can't hold a runner for the 6-hour default"

# The job only reads the repository; this caps whatever the caller grants.
permissions:
  contents: read

# The group name is specific to this workflow so it can't collide with a
# concurrency group the caller defines (identical groups deadlock). It includes
# the tested repository, because one caller (the weekly run) tests many
# modules at once. Only PR runs are cancelled; every push still gets a result.
concurrency:
  group: islandora-module-ci-${{ inputs.repository || github.repository }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Compute Drupal x PHP matrix
        id: compute
        env:
          MINORS_PER_MAJOR: ${{ inputs.minors_per_major }}
          INCLUDE_NEXT_MAJOR: ${{ inputs.include_next_major }}
          DRUPAL_VERSIONS: ${{ inputs.drupal_versions }}
          PHP_VERSIONS: ${{ inputs.php_versions }}
        run: |
          set -euo pipefail
          image=ghcr.io/islandora/ci
          fetch() { curl -fsSL --retry 3 --retry-all-errors "$@"; }

          feed=$(fetch https://updates.drupal.org/release-history/drupal/current)
          supported=$(sed -n 's:.*<supported_branches>\(.*\)</supported_branches>.*:\1:p' <<<"$feed" | tr ',' '\n' | sed 's/\.$//' | grep .)
          releases=$(grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+[^<]*</version>' <<<"$feed" | sed -E 's:</?version>::g')

          token=$(fetch "https://ghcr.io/token?scope=repository:islandora/ci:pull" | jq -r .token)
          tags=$(fetch -H "Authorization: Bearer $token" "https://ghcr.io/v2/islandora/ci/tags/list?n=1000" \
            | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+-php[0-9]+\.[0-9]+$' || true)
          image_php=$(awk -F-php '{print $2}' <<<"$tags" | sort -uV)

          # One line per Drupal minor: "<minor> <experimental>"
          if [ -n "$DRUPAL_VERSIONS" ]; then
            plan=$(jq -r '.[] | "\(.) false"' <<<"$DRUPAL_VERSIONS")
          else
            plan=""
            while read -r major; do
              stable=$(grep -E "^${major}\.[0-9]+\.[0-9]+$" <<<"$releases" | cut -d. -f1,2 | sort -uVr | head -n "$MINORS_PER_MAJOR" || true)
              if [ -n "$stable" ]; then
                plan+=$(awk '{print $0 " false"}' <<<"$stable")$'\n'
              elif [ "$INCLUDE_NEXT_MAJOR" = true ]; then
                plan+="$(grep -E "^${major}\." <<<"$supported" | sort -Vr | head -n1) true"$'\n'
              fi
            done < <(cut -d. -f1 <<<"$supported" | sort -un)
          fi

          rows=()
          while read -r minor experimental; do
            [ -n "$minor" ] || continue
            if [ -n "$PHP_VERSIONS" ]; then
              phps=$(jq -r '.[]' <<<"$PHP_VERSIONS")
            else
              min_php=$(fetch "https://git.drupalcode.org/project/drupal/-/raw/${minor}.x/core/composer.json" \
                | jq -r '.require.php' | grep -oE '[0-9]+\.[0-9]+' | head -n1)
              allowed=$(awk -v m="$min_php" 'BEGIN{split(m,a,".")} {split($0,b,"."); if (b[1]>a[1] || (b[1]==a[1] && b[2]>=a[2])) print}' <<<"$image_php")
              [ -n "$allowed" ] || allowed=$min_php
              phps=$( (head -n1 <<<"$allowed"; tail -n1 <<<"$allowed") | sort -uV )
            fi
            for php in $phps; do
              tag="${minor}-php${php}"
              build=true
              if grep -qx "$tag" <<<"$tags"; then build=false; fi
              rows+=("$(jq -cn --arg d "$minor" --arg p "$php" --arg i "$image:$tag" \
                --argjson b "$build" --argjson e "$experimental" \
                '{drupal:$d, php:$p, image:$i, build:$b, experimental:$e}')")
            done
          done <<<"$plan"

          [ "${#rows[@]}" -gt 0 ] || { echo "::error::Computed an empty Drupal x PHP matrix"; exit 1; }
          matrix=$(printf '%s\n' "${rows[@]}" | jq -sc '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "| Drupal | PHP | Image | Blocking |"
            echo "| --- | --- | --- | --- |"
            jq -r '.include[] | "| \(.drupal) | \(.php) | \(.image)\(if .build then " (built in the job)" else "" end) | \(if .experimental then "no (next major)" else "yes" end) |"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    name: PHP ${{ matrix.php }} | Drupal ${{ matrix.drupal }}${{ matrix.experimental && ' (next major, non-blocking)' || '' }}

    env:
      ENABLE_MODULES: ${{ inputs.module_name }}

    steps:
      - name: Checkout code
        if: ${{ inputs.repository == '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Checkout ${{ inputs.repository }}
        if: ${{ inputs.repository != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # Next-major steps may fail without failing the job: the "Next major"
      # step below turns a failure into a warning instead.
      - name: Build CI image (not published for this pair yet)
        id: image
        if: ${{ matrix.build }}
        continue-on-error: ${{ matrix.experimental }}
        run: |
          docker build \
            --tag "${{ matrix.image }}" \
            --build-arg "DRUPAL_VERSION=${{ matrix.drupal }}.x" \
            --build-arg "PHP_VERSION=${{ matrix.php }}" \
            "https://github.com/Islandora/islandora_ci.git#main"

      - name: Create docker network
        run: docker network create ci-default

      - name: Start chromedriver
        if: ${{ inputs.install_chromedriver }}
        run: |
          docker run -d \
            --name chromedriver \
            --network ci-default \
            drupalci/webdriver-chromedriver:production \
            chromedriver --log-path=/dev/null --verbose --allowed-ips= --allowed-origins=*

      - name: PHPUnit tests
        id: tests
        if: ${{ steps.image.outcome != 'failure' }}
        continue-on-error: ${{ matrix.experimental }}
        run: |
          docker run \
            --rm \
            --name drupal \
            --hostname drupal \
            --volume "$PWD:/var/www/drupal/web/modules/contrib/$ENABLE_MODULES:ro" \
            --env ENABLE_MODULES \
            --network ci-default \
            "${{ matrix.image }}"

      - name: Next major
        if: ${{ matrix.experimental }}
        env:
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$IMAGE_OUTCOME" = failure ]; then
            msg="Drupal ${{ matrix.drupal }}: the CI image could not be built yet (non-blocking)."
          elif [ "$TESTS_OUTCOME" = failure ]; then
            msg="Drupal ${{ matrix.drupal }}: tests failed (non-blocking until its first stable release)."
          else
            msg="Drupal ${{ matrix.drupal }}: passed."
          fi
          echo "::warning title=Next Drupal major::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  # One check with a fixed name. Require this one in branch protection rather
  # than the matrix jobs, whose names change whenever a Drupal minor is added
  # or dropped.
  result:
    needs: [matrix, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All blocking jobs passed
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "matrix: $MATRIX_RESULT, build: $BUILD_RESULT"
          [ "$MATRIX_RESULT" = success ] && [ "$BUILD_RESULT" = success ]
